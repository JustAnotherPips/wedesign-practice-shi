
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h2 class="logo">EXPLORE.</h2>

        <div class="links">
            <a href="#home">Home</a>
            <a href="#discover">Discover</a>
        </div>
    </nav>

    <section class="hero" id="home">

        <div class="content">
            <small>DISCOVER THE WORLD</small>

            <h1 id="title">Beyond the Ordinary.</h1>

            <p id="description">
                Explore beautiful places and discover
                your next adventure.
            </p>

            <a href="#discover" class="btn">
                Explore Now →
            </a>
        </div>

    </section>

    <section class="discover" id="discover">

        <h2>Popular Destinations</h2>

        <div class="cards">

            <button class="card mountain"
                onclick="changeHero(0)">
                Mountains
            </button>

            <button class="card ocean"
                onclick="changeHero(1)">
                Ocean
            </button>

            <button class="card forest"
                onclick="changeHero(2)">
                Forest
            </button>

        </div>

    </section>

    <footer>
        © 2026 Explore. All rights reserved.
    </footer>

    <script src="script.js"></script>
</body>
</html>
